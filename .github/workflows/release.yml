name: Release Sentinel Panel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.0.1)'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: 🌐 Build Docker Image & Publish Panel Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Determine Release Version & Image Name
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REPO_OWNER_RAW: ${{ github.repository_owner }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW_VER="$INPUT_VERSION"
          else
            RAW_VER="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$RAW_VER" ]; then RAW_VER="v0.0.1"; fi
          CLEAN_VER="${RAW_VER#v}"
          
          echo "Determined Release Version: $RAW_VER (Clean: $CLEAN_VER)"
          echo "RELEASE_TAG=${RAW_VER}" >> $GITHUB_ENV
          echo "CLEAN_VERSION=${CLEAN_VER}" >> $GITHUB_ENV

          # Lowercase owner/repo for GHCR compatibility
          REPO_OWNER=$(echo "$REPO_OWNER_RAW" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${REPO_OWNER}/sentinel-panel" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v5.5.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.CLEAN_VERSION }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package Production Bundle & Standalone Files
        shell: bash
        run: |
          mkdir -p release-artifacts
          ARCHIVE_NAME="sentinel-panel-${RELEASE_TAG}.tar.gz"
          echo "==> Packaging production tarball: $ARCHIVE_NAME"

          tar --exclude='.git' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='.pytest_cache' \
              --exclude='.venv' \
              --exclude='scratch' \
              --exclude='*.db*' \
              --exclude='test_*' \
              --exclude='tests' \
              --exclude='.coverage' \
              -czf "release-artifacts/${ARCHIVE_NAME}" \
              backend/ frontend/ dist-react/ bot/ locales/ host/ installation/ \
              docker-compose.yml Dockerfile docker-entrypoint.sh requirements.txt update.sh .env.example register_node.py README.md

          echo "==> Preparing standalone deployment files..."
          cp docker-compose.yml release-artifacts/
          cp docker-entrypoint.sh release-artifacts/
          cp .env.example release-artifacts/
          cp installation/install_with_docker.sh release-artifacts/
          cp update.sh release-artifacts/

          echo "==> Generating SHA256 checksums..."
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb872386ac92a23c4b34498 # v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sentinel Control Panel ${{ env.RELEASE_TAG }}
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/docker-compose.yml
            release-artifacts/docker-entrypoint.sh
            release-artifacts/.env.example
            release-artifacts/install_with_docker.sh
            release-artifacts/update.sh
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
