<!-- Блок Правил маршрутизации (Routing Rules) -->
<div class="routing-section glass-card" style="margin-bottom: 25px;">
    <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 data-i18n="routing_rules_title" style="margin: 0; font-size: 1.3rem;"><i class="fa-solid fa-route" style="margin-right: 8px;"></i>Правила маршрутизации</h3>
        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <button id="export-routing-preset-btn" class="btn secondary-btn" style="padding: 6px 12px; font-size: 13px;"><i class="fa-solid fa-download" style="margin-right: 5px;"></i><span>Экспорт пресета</span></button>
            <button id="import-routing-preset-btn" class="btn secondary-btn" style="padding: 6px 12px; font-size: 13px;"><i class="fa-solid fa-file-import" style="margin-right: 5px;"></i><span>Импорт пресета</span></button>
            <button id="add-routing-rule-btn" class="btn primary-btn" style="padding: 6px 12px; font-size: 13px;"><i class="fa-solid fa-plus" style="margin-right: 5px;"></i><span data-i18n="routing_add_rule">Добавить правило</span></button>
        </div>
    </div>
    <p style="font-size: 13px; color: var(--text-secondary); margin-top: -10px; margin-bottom: 15px;" data-i18n="routing_rules_desc">
        Правила проверяются сверху вниз. Вы можете менять порядок (приоритет) правил перетаскиванием или стрелками.
    </p>
    <div class="table-container" style="overflow-x: auto;">
        <table class="glass-table" style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead>
                <tr style="border-bottom: 2px solid var(--border-color); color: var(--text-secondary);">
                    <th style="width: 40px;"></th>
                    <th style="width: 60px;" data-i18n="routing_th_priority">Порядок</th>
                    <th data-i18n="routing_th_remark">Описание</th>
                    <th data-i18n="routing_th_conditions">Условия (Домены / IP / Протоколы / Входящие)</th>
                    <th data-i18n="routing_th_outbound">Назначение</th>
                    <th data-i18n="routing_th_status">Активно</th>
                    <th style="width: 180px;" data-i18n="routing_th_actions">Действия</th>
                </tr>
            </thead>
            <tbody id="routing-rules-tbody">
                <!-- Заполняется динамически -->
            </tbody>
        </table>
    </div>
</div>
