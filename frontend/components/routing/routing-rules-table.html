
<div class="routing-section glass-card" style="margin-bottom: 25px;">
<div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
<h3 data-i18n="routing_rules_title" style="margin: 0; font-size: 1.3rem;"><i class="fa-solid fa-route" style="margin-right: 8px;"></i></h3>
<div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
<button class="btn secondary-btn" id="export-routing-preset-btn" style="padding: 6px 12px; font-size: 13px;"><i class="fa-solid fa-download" style="margin-right: 5px;"></i><span data-i18n="routing_export_preset_btn"></span></button>
<button class="btn secondary-btn" id="import-routing-preset-btn" style="padding: 6px 12px; font-size: 13px;"><i class="fa-solid fa-file-import" style="margin-right: 5px;"></i><span data-i18n="routing_import_preset_btn"></span></button>
<button class="btn primary-btn" id="add-routing-rule-btn" style="padding: 6px 12px; font-size: 13px;"><i class="fa-solid fa-plus" style="margin-right: 5px;"></i><span data-i18n="routing_add_rule"></span></button>
</div>
</div>
<p data-i18n="routing_rules_desc" style="font-size: 13px; color: var(--text-secondary); margin-top: -10px; margin-bottom: 15px;"></p>
<div class="table-container" style="overflow-x: auto;">
<table class="glass-table" style="width: 100%; border-collapse: collapse; text-align: left;">
<thead>
<tr style="border-bottom: 2px solid var(--border-color); color: var(--text-secondary);">
<th style="width: 40px;"></th>
<th data-i18n="routing_th_priority" style="width: 60px;"></th>
<th data-i18n="routing_th_remark"></th>
<th data-i18n="routing_th_conditions"></th>
<th data-i18n="routing_th_outbound"></th>
<th data-i18n="routing_th_status"></th>
<th data-i18n="routing_th_actions" style="width: 180px;"></th>
</tr>
</thead>
<tbody id="routing-rules-tbody">

</tbody>
</table>
</div>
</div>
