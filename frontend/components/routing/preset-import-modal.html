
<div class="modal" id="routing-preset-import-modal" style="z-index: 1100;">
<div class="glass-card modal-card" style="background: hsl(223, 47%, 11%) !important; width: 500px; max-width: 95%;">
<div class="modal-header">
<h3 data-i18n="routing_preset_import_title"></h3>
<button class="btn icon-btn close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
</div>
<form id="routing-preset-import-form">
<div class="input-group">
<label data-i18n="routing_preset_template_label" for="preset-template-select"></label>
<select class="glass-select" id="preset-template-select">
<option data-i18n="routing_preset_opt_custom" value="custom"></option>
<!-- Dynamically populated from sentinel-core presets -->
</select>
</div>
<div class="input-group" id="preset-file-group">
<label data-i18n="routing_preset_file_label" for="preset-json-file"></label>
<input accept=".json" id="preset-json-file" type="file"/>
</div>
<div class="input-group">
<label data-i18n="routing_preset_mode_label" for="preset-mode-select"></label>
<select class="glass-select" id="preset-mode-select">
<option data-i18n="routing_preset_mode_append" selected="" value="append"></option>
<option data-i18n="routing_preset_mode_overwrite" value="overwrite"></option>
</select>
</div>
<button class="btn primary-btn" style="width: 100%; margin-top: 15px;" type="submit"><i class="fa-solid fa-file-import" style="margin-right: 5px;"></i><span data-i18n="routing_preset_btn_import"></span></button>
</form>
</div>
</div>
