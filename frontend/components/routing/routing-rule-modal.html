
<div class="modal" id="routing-rule-modal" style="z-index: 1100;">
<div class="glass-card modal-card" style="background: hsl(223, 47%, 11%) !important; width: 550px; max-width: 95%;">
<div class="modal-header">
<h3 data-i18n="routing_rule_modal_title" id="routing-rule-modal-title"></h3>
<button class="btn icon-btn close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
</div>
<div class="modal-body">
<form id="routing-rule-form">
<input id="rule-id" type="hidden"/>
<div class="input-group">
<label data-i18n="routing_rule_modal_remark" for="rule-remark"></label>
<input id="rule-remark" type="text"/>
</div>
<div class="input-row">
<div class="input-group">
<label data-i18n="routing_rule_modal_outbound" for="rule-outbound"></label>
<select class="glass-select" id="rule-outbound">

</select>
</div>
<div class="input-group">
<label data-i18n="routing_rule_modal_protocols" for="rule-protocols"></label>
<input data-i18n-placeholder="routing_rule_protocols_placeholder" id="rule-protocols" placeholder="" type="text"/>
</div>
</div>
<div class="input-row">
<div class="input-group">
<label data-i18n="routing_rule_modal_inbound" for="rule-inbound-select"></label>
<select class="glass-select" id="rule-inbound-select">
<option data-i18n="routing_rule_modal_all_inbounds" value=""></option>
</select>
</div>
<div class="input-group" id="rule-client-select-group" style="display: none;">
<label data-i18n="routing_rule_modal_client" for="rule-client-select"></label>
<select class="glass-select" id="rule-client-select">
<option data-i18n="routing_rule_modal_all_clients" value=""></option>
</select>
</div>
</div>
<div class="input-group">
<label data-i18n="routing_rule_modal_domains" for="rule-domains"></label>
<textarea data-i18n-placeholder="routing_rule_modal_domains_placeholder" id="rule-domains" placeholder="" rows="3"></textarea>
</div>
<div class="input-group">
<label data-i18n="routing_rule_modal_ips" for="rule-ips"></label>
<textarea data-i18n-placeholder="routing_rule_modal_ips_placeholder" id="rule-ips" placeholder="" rows="3"></textarea>
</div>
<div class="input-group checkbox-group" style="margin-bottom: 15px;">
<label style="display: inline-flex; align-items: center; gap: 10px; cursor: pointer;">
<span class="switch-toggle">
<input checked="" id="rule-enable" type="checkbox"/>
<span class="switch-slider"></span>
</span>
<span data-i18n="routing_rule_modal_enable"></span>
</label>
</div>
<button class="btn primary-btn" type="submit"><i class="fa-solid fa-floppy-disk" style="margin-right: 5px;"></i><span data-i18n="routing_modal_save"></span></button>
</form>
</div>
</div>
</div>
