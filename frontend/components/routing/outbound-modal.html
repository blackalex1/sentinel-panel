<div class="modal" id="outbound-modal" style="z-index: 1100;">
    <div class="glass-card modal-card large-card" style="background: hsl(223, 47%, 11%) !important; max-width: 1120px; width: 92vw; padding: 32px 36px;">
        <div class="modal-header">
            <h3 data-i18n="routing_modal_create_outbound" id="outbound-modal-title"></h3>
            <button class="btn icon-btn close-modal-btn" type="button"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
            <form id="outbound-form" novalidate>
                <input id="ob-id" type="hidden"/>
                
                <!-- Quick Link Import Input (Powered by sentinel-core URI parser) -->
                <div class="input-group" id="ob-import-group" style="margin-bottom: 18px;">
                    <label data-i18n="routing_modal_import_link" for="ob-import-link"></label>
                    <div style="position: relative;">
                        <input data-i18n-placeholder="routing_modal_import_placeholder" id="ob-import-link" placeholder="Вставьте vless://, ss://, hysteria2://, socks:// и т.д." type="text" style="padding-right: 40px;"/>
                        <i class="fa-solid fa-paste" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--primary); pointer-events: none;"></i>
                    </div>
                </div>

                <!-- Protocol Selector (Dynamic from Core Schema) -->
                <div class="input-row" style="margin-bottom: 20px;">
                    <div class="input-group" style="flex: 1;">
                        <label data-i18n="routing_modal_protocol" for="ob-protocol"></label>
                        <select class="glass-select" id="ob-protocol">
                            <!-- Dynamically loaded from sentinel-core outboundProtocols -->
                        </select>
                    </div>
                </div>

                <!-- Dynamic Modal Tabs (Generated from sentinel-core schema) -->
                <div class="modal-tabs" id="outbound-modal-tabs" style="margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px;"></div>

                <!-- Dynamic Form Panels Container (Rendered from sentinel-core schema) -->
                <div id="outbound-schema-container"></div>

                <!-- Modal Actions -->
                <div class="modal-actions" style="margin-top: 25px; display: flex; justify-content: space-between; align-items: center;">
                    <button class="btn secondary-btn" id="ob-test-btn" type="button">
                        <i class="fa-solid fa-bolt" style="margin-right: 6px;"></i>
                        <span data-i18n="routing_btn_test_outbound">Проверить подключение</span>
                    </button>
                    <div style="display: flex; gap: 12px;">
                        <button class="btn secondary-btn close-modal-btn" data-i18n="btn_cancel" type="button"></button>
                        <button class="btn primary-btn" id="ob-submit-btn" type="button">
                            <i class="fa-solid fa-check" style="margin-right: 6px;"></i>
                            <span data-i18n="btn_save"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
