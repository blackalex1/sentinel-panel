<!-- Custom Config Warning Banner -->
<div class="alert-banner alert-warning" id="custom-config-warning-banner" style="display: none; margin-bottom: 20px; background: rgba(234, 179, 8, 0.12); border: 1px solid rgba(234, 179, 8, 0.4); border-radius: 12px; padding: 15px 20px; align-items: center; justify-content: space-between; gap: 15px;">
<div style="display: flex; align-items: center; gap: 14px;">
<i class="fa-solid fa-triangle-exclamation" style="font-size: 24px; color: #f59e0b;"></i>
<div>
<div data-i18n="routing_custom_config_banner_title" id="custom-config-banner-title" style="font-weight: 700; font-size: 14px; color: var(--text-primary);"></div>
<div data-i18n="routing_custom_config_banner_text" id="custom-config-banner-text" style="font-size: 12px; color: var(--text-secondary); margin-top: 2px;"></div>
</div>
</div>
<button class="btn btn-secondary" id="btn-reset-custom-config" style="white-space: nowrap; font-size: 12px; padding: 8px 14px; background: rgba(234, 179, 8, 0.2); border: 1px solid rgba(234, 179, 8, 0.4); color: #fff; cursor: pointer;">
<i class="fa-solid fa-rotate-left" style="margin-right: 6px;"></i> <span data-i18n="routing_custom_config_btn_reset"></span>
</button>
</div>

<!-- Quick Security Rules Section -->
<div class="routing-section glass-card" id="quick-security-rules-card" style="margin-bottom: 25px;">
<h3 data-i18n="routing_quick_rules_title" style="margin-top: 0; margin-bottom: 15px; font-size: 1.3rem;"><i class="fa-solid fa-sliders" style="margin-right: 8px; color: var(--accent-color);"></i></h3>
<p class="card-desc" data-i18n="routing_quick_rules_desc" style="font-size: 13px; color: var(--text-secondary); margin-bottom: 20px;"></p>
<div class="quick-rules-grid" id="quick-security-rules-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
<!-- Dynamically populated from sentinel-core presets -->
</div>
<div style="margin-top: 20px; display: flex; justify-content: flex-end;">
<button class="btn primary-btn" id="btn-save-quick-rules" style="padding: 8px 16px;"><i class="fa-solid fa-floppy-disk" style="margin-right: 5px;"></i><span data-i18n="routing_save_quick_rules"></span></button>
</div>
</div>

<!-- DNS Routing Configuration Section -->
<div class="routing-section glass-card" id="card-dns" style="margin-bottom: 25px;">
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;">
<h3 data-i18n="settings_dns_title" style="margin: 0; font-size: 1.3rem;"><i class="fa-solid fa-network-wired" style="margin-right: 8px; color: var(--accent-color);"></i></h3>
<span class="badge" style="background: rgba(139, 92, 246, 0.15); color: var(--primary); border: 1px solid rgba(139, 92, 246, 0.3); font-size: 11px; padding: 4px 10px; border-radius: 20px;">DoH / Split-DNS</span>
</div>
<p class="card-desc" data-i18n="settings_dns_desc" style="font-size: 13px; color: var(--text-secondary); margin-bottom: 20px;"></p>

<div class="settings-form-content" style="display: flex; flex-direction: column; gap: 16px;">
<div class="input-group">
<label data-i18n="settings_dns_preset" for="setting-dns-preset" style="font-size: 13px; font-weight: 600; margin-bottom: 6px;"></label>
<select id="setting-dns-preset" class="select-input" style="width: 100%; padding: 8px 12px; border-radius: 8px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary);">
<option value="google">Google DNS (8.8.8.8 DoH - Рекомендовано)</option>
<option value="cloudflare">Cloudflare (1.1.1.1 DoH)</option>
<option value="adguard">AdGuard DNS (AdBlock DoH)</option>
<option value="yandex">Yandex DNS (77.88.8.8 DoH - Direct RU)</option>
<option value="custom" data-i18n="settings_dns_preset_custom">Пользовательский (Custom)</option>
</select>
</div>

<div class="input-row" style="display: flex; flex-wrap: wrap; gap: 15px;">
<div class="input-group" style="flex: 1 1 240px;">
<label data-i18n="settings_dns_remote" for="setting-dns-remote" style="font-size: 13px; font-weight: 600; margin-bottom: 6px;"></label>
<input id="setting-dns-remote" placeholder="https://1.1.1.1/dns-query" type="text" class="text-input" style="width: 100%; padding: 8px 12px; border-radius: 8px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary);"/>
<span class="field-desc" data-i18n="settings_dns_remote_desc" style="font-size: 11px; color: var(--text-secondary); margin-top: 4px; display: block;"></span>
</div>
<div class="input-group" style="flex: 1 1 240px;">
<label data-i18n="settings_dns_direct" for="setting-dns-direct" style="font-size: 13px; font-weight: 600; margin-bottom: 6px;"></label>
<input id="setting-dns-direct" placeholder="https://8.8.8.8/dns-query" type="text" class="text-input" style="width: 100%; padding: 8px 12px; border-radius: 8px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary);"/>
<span class="field-desc" data-i18n="settings_dns_direct_desc" style="font-size: 11px; color: var(--text-secondary); margin-top: 4px; display: block;"></span>
</div>
</div>

<div class="input-row" style="display: flex; flex-wrap: wrap; gap: 15px;">
<div class="input-group" style="flex: 1 1 240px;">
<label data-i18n="settings_dns_strategy" for="setting-dns-strategy" style="font-size: 13px; font-weight: 600; margin-bottom: 6px;"></label>
<select id="setting-dns-strategy" class="select-input" style="width: 100%; padding: 8px 12px; border-radius: 8px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary);">
<option value="ipv4_only">IPv4 Only (Рекомендовано)</option>
<option value="prefer_ipv4">Prefer IPv4</option>
<option value="prefer_ipv6">Prefer IPv6</option>
<option value="ipv6_only">IPv6 Only</option>
</select>
</div>
<div class="input-group" id="setting-dns-custom-group" style="flex: 1 1 240px;">
<label data-i18n="settings_dns_custom_servers" for="setting-dns-custom" style="font-size: 13px; font-weight: 600; margin-bottom: 6px;"></label>
<input id="setting-dns-custom" placeholder="https://dns.google/dns-query, 8.8.8.8" type="text" class="text-input" style="width: 100%; padding: 8px 12px; border-radius: 8px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary);"/>
<span class="field-desc" data-i18n="settings_dns_custom_desc" style="font-size: 11px; color: var(--text-secondary); margin-top: 4px; display: block;"></span>
</div>
</div>

<div style="margin-top: 10px; display: flex; justify-content: flex-end;">
<button class="btn primary-btn" id="btn-save-dns" style="padding: 8px 16px;" type="button">
<i class="fa-solid fa-floppy-disk" style="margin-right: 5px;"></i><span data-i18n="settings_btn_save_short"></span>
</button>
</div>
</div>
</div>
