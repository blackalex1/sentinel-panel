<div class="modal" id="clients-modal" style="z-index: 1050;">
<div class="glass-card modal-card large-card">
<div class="modal-header">
<h2><span data-i18n="clients_modal_title"></span> <span id="clients-modal-ib-remark"></span></h2>
<button class="btn close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
</div>
<div class="modal-body">
<div class="action-bar" style="display: flex; gap: 10px; align-items: center;">
<button class="btn primary-btn" id="add-client-btn"><i class="fa-solid fa-user-plus"></i> <span data-i18n="clients_add_btn"></span></button>
<button class="btn secondary-btn" id="reset-all-clients-btn"><i class="fa-solid fa-arrows-rotate"></i> <span data-i18n="clients_reset_all_traffic_btn"></span></button>
</div>
<div class="table-container">
<table class="glass-table">
<thead>
<tr>
<th data-sort="email" style="cursor: pointer; user-select: none;"><span data-i18n="clients_th_email"></span> <span class="sort-icon">↕</span></th>
<th data-sort="status" style="cursor: pointer; user-select: none;"><span data-i18n="clients_th_status"></span> <span class="sort-icon">↕</span></th>
<th data-sort="used" style="cursor: pointer; user-select: none;"><span data-i18n="clients_th_used"></span> <span class="sort-icon">↕</span></th>
<th data-sort="limit" style="cursor: pointer; user-select: none;"><span data-i18n="clients_th_limit"></span> <span class="sort-icon">↕</span></th>
<th data-sort="expiry" style="cursor: pointer; user-select: none;"><span data-i18n="clients_th_expiry"></span> <span class="sort-icon">↕</span></th>
<th data-i18n="clients_th_actions"></th>
</tr>
</thead>
<tbody id="clients-table-body">

</tbody>
</table>
</div>
<!-- Chart Container (hidden by default) -->
<div id="client-traffic-chart-container" style="display: none; margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--border-color);">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
<h3 data-i18n="clients_traffic_chart_title" style="margin: 0; font-size: 16px; color: var(--text-primary);"></h3>
<button class="btn secondary-btn icon-btn" id="btn-close-traffic-chart" style="padding: 5px 10px;" type="button"><i class="fa-solid fa-xmark"></i></button>
</div>
<div style="position: relative; height: 220px; width: 100%;">
<canvas id="client-traffic-canvas"></canvas>
</div>
</div>
</div>
</div>
</div>
