<section class="tab-content" id="tab-inbounds">
<div class="action-bar" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; background: rgba(255, 255, 255, 0.015); padding: 16px 20px; border-radius: 16px; border: 1px solid var(--border-color);">
<div style="display: flex; align-items: center; gap: 12px;">
<button class="btn primary-btn" id="add-inbound-btn" style="padding: 10px 18px; font-size: 13px; font-weight: 700; border-radius: 10px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(6, 182, 212, 0.25);">
<i class="fa-solid fa-plus" style="font-size: 14px;"></i> <span data-i18n="inbounds_add_btn"></span>
</button>
</div>
<div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
<div class="search-bar" style="position: relative; width: 280px;">
<i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 13px;"></i>
<input data-i18n-placeholder="inbounds_search_placeholder" id="inbounds-search" placeholder="" style="width: 100%; padding: 9px 16px 9px 38px; font-size: 13px; height: 40px; border-radius: 10px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color); color: var(--text-primary); outline: none;" type="text"/>
</div>
<div class="sort-wrap" style="min-width: 180px;">
<select class="glass-select" id="inbounds-sort">
<option data-i18n="sort_id_asc" value="id_asc"></option>
<option data-i18n="sort_remark_asc" value="remark_asc"></option>
<option data-i18n="sort_remark_desc" value="remark_desc"></option>
<option data-i18n="sort_port_asc" value="port_asc"></option>
<option data-i18n="sort_port_desc" value="port_desc"></option>
<option data-i18n="sort_traffic_desc" value="traffic_desc"></option>
<option data-i18n="sort_proto_asc" value="protocol_asc"></option>
</select>
</div>
</div>
</div>

<div class="inbounds-grid" id="inbounds-list">

</div>
</section>
