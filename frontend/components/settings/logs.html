<!-- SECTION 6: LOGS & AUDIT -->
<div class="settings-section-panel" id="sec-logs">
<!-- CARD 6.5: Active Sessions -->
<div class="glass-card settings-card">
<h3 data-i18n="active_sessions_title"></h3>
<p class="card-desc" data-i18n="active_sessions_desc"></p>
<div style="margin-top: 20px;">
<div class="table-container">
<table class="glass-table">
<thead>
<tr>
<th data-i18n="sessions_th_ip" style="white-space: nowrap;"></th>
<th data-i18n="sessions_th_ua" style="white-space: nowrap;"></th>
<th data-i18n="sessions_th_created" style="white-space: nowrap;"></th>
<th data-i18n="sessions_th_expires" style="white-space: nowrap;"></th>
<th data-i18n="sessions_th_action" style="text-align: right; width: 100px;"></th>
</tr>
</thead>
<tbody id="active-sessions-tbody">

</tbody>
</table>
</div>
</div>
</div>
<!-- CARD 7: Action Audit Logs -->
<div class="glass-card settings-card">
<h3 data-i18n="audit_logs_title"></h3>
<p class="card-desc" data-i18n="audit_logs_desc"></p>
<div style="margin-top: 20px;">
<div style="margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
<div class="search-bar" style="flex-grow: 1; min-width: 200px; margin-bottom: 0;">
<i class="fa-solid fa-magnifying-glass"></i>
<input data-i18n-placeholder="audit_logs_search" id="audit-logs-search" placeholder="" type="text"/>
</div>
<div style="min-width: 180px;">
<select id="audit-logs-category" style="width: 100%; height: 40px; padding: 0 10px; border-radius: var(--border-radius); background: var(--bg-input, rgba(255,255,255,0.05)); border: 1px solid var(--border-color, rgba(255,255,255,0.1)); color: var(--text-primary); cursor: pointer; outline: none; font-size: 14px;">
<option data-i18n="audit_cat_all" value=""></option>
<option data-i18n="audit_cat_logins" value="login"></option>
<option data-i18n="audit_cat_clients" value="client"></option>
<option data-i18n="audit_cat_inbounds" value="inbound"></option>
<option data-i18n="audit_cat_security" value="block"></option>
<option data-i18n="audit_cat_settings" value="setting"></option>
</select>
</div>
<button class="btn danger-btn" id="btn-clear-connections" style="height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 15px; font-size: 13px; font-weight: 600; border: 1px solid rgba(255, 71, 87, 0.3); color: #ff4757; background: rgba(255, 71, 87, 0.1);" type="button">
<i class="fa-solid fa-trash-can"></i>
<span data-i18n="btn_clear_connections"></span>
</button>
</div>
<div class="table-container">
<table class="glass-table">
<thead>
<tr>
<th data-i18n="audit_logs_th_time" style="white-space: nowrap;"></th>
<th data-i18n="audit_logs_th_user" style="white-space: nowrap;"></th>
<th data-i18n="audit_logs_th_action" style="white-space: nowrap;"></th>
<th data-i18n="audit_logs_th_target" style="white-space: nowrap;"></th>
<th data-i18n="audit_logs_th_details"></th>
</tr>
</thead>
<tbody id="audit-logs-tbody">

</tbody>
</table>
</div>

<div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
<span id="audit-logs-total-text" style="font-size: 13px; color: var(--text-secondary);"></span>
<div style="display: flex; gap: 8px;">
<button class="btn secondary-btn icon-btn" id="btn-audit-prev" style="padding: 6px 12px;" type="button"><i class="fa-solid fa-chevron-left"></i></button>
<span id="audit-page-number" style="align-self: center; font-size: 14px; font-weight: 500; min-width: 30px; text-align: center;">1</span>
<button class="btn secondary-btn icon-btn" id="btn-audit-next" style="padding: 6px 12px;" type="button"><i class="fa-solid fa-chevron-right"></i></button>
</div>
</div>
</div>
</div>
</div>
