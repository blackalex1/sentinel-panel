<!-- SECTION 5: BACKUPS -->
<div class="settings-section-panel" id="sec-backups">

<div class="glass-card settings-card">
<h3 data-i18n="settings_backups_title"></h3>
<p class="card-desc" data-i18n="settings_backups_desc"></p>
<div class="settings-form-content" style="margin-top: auto; display: flex; flex-direction: column; gap: 15px;">
<div style="display: flex; flex-direction: column; gap: 12px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px 20px;">
<label class="checkbox-container" style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-secondary); font-size: 14px; font-weight: normal; text-transform: none; margin-bottom: 0;">
<input id="setting-backup-enable" type="checkbox"/>
<span data-i18n="settings_backup_enable"></span>
</label>
<label class="checkbox-container" style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-secondary); font-size: 14px; font-weight: normal; text-transform: none; margin-bottom: 0;">
<input id="setting-backup-telegram" type="checkbox"/>
<span data-i18n="settings_backup_telegram"></span>
</label>
<label class="checkbox-container" style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-secondary); font-size: 14px; font-weight: normal; text-transform: none; margin-bottom: 0;">
<input id="setting-backup-encrypt" type="checkbox"/>
<span data-i18n="settings_backup_encrypt"></span>
</label>
</div>
<div class="input-group" id="setting-backup-password-group" style="display: none; margin-top: 15px; border-top: 1px dashed var(--border-color); padding-top: 15px;">
<h4 data-i18n="settings_backup_change_pwd_title" style="margin-bottom: 15px; font-size: 14px; color: var(--text-primary);"></h4>
<div class="input-group" style="margin-bottom: 12px;">
<label data-i18n="settings_backup_current_password" for="setting-backup-current-password"></label>
<input data-i18n-placeholder="settings_backup_current_pwd_placeholder" id="setting-backup-current-password" placeholder="" type="password"/>
</div>
<div class="input-group" style="margin-bottom: 12px;">
<label data-i18n="settings_backup_new_password" for="setting-backup-new-password"></label>
<div class="copy-input-group">
<input data-i18n-placeholder="settings_backup_new_pwd_placeholder" id="setting-backup-new-password" placeholder="" type="text"/>
<button class="btn secondary-btn" data-i18n-title="ib_title_generate" id="btn-change-backup-gen" title="" type="button"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
</div>
</div>
<div class="input-group" style="margin-bottom: 15px;">
<label data-i18n="settings_backup_confirm_password" for="setting-backup-confirm-password"></label>
<input data-i18n-placeholder="settings_backup_confirm_pwd_placeholder" id="setting-backup-confirm-password" placeholder="" type="password"/>
</div>
<button class="btn primary-btn w-100" id="btn-change-backup-password" style="padding: 10px; font-weight: 600; margin-bottom: 15px;" type="button"><i class="fa-solid fa-key"></i> <span data-i18n="settings_backup_btn_change_password"></span></button>
<div id="setting-backup-password-warning" style="background: rgba(255, 159, 67, 0.1); border: 1px solid rgba(255, 159, 67, 0.25); border-radius: 8px; padding: 12px; color: #ff9f43; font-size: 13px; line-height: 1.4; display: flex; align-items: flex-start; gap: 8px;">
<i class="fa-solid fa-triangle-exclamation" style="margin-top: 2px;"></i>
<span data-i18n="settings_backup_password_warning"></span>
</div>
</div>
<div class="input-row" style="display: flex; flex-wrap: wrap; gap: 15px;">
<div class="input-group" style="flex: 1 1 150px;">
<label data-i18n="settings_backup_interval" for="setting-backup-interval"></label>
<select id="setting-backup-interval">
<option data-i18n="settings_backup_interval_hourly" value="hourly"></option>
<option data-i18n="settings_backup_interval_daily" selected="" value="daily"></option>
<option data-i18n="settings_backup_interval_weekly" value="weekly"></option>
</select>
</div>
<div class="input-group" id="setting-backup-rotation-group" style="flex: 1 1 150px;">
<label data-i18n="settings_backup_rotation" for="setting-backup-rotation"></label>
<input id="setting-backup-rotation" min="1" type="number" value="7"/>
</div>
</div>
<div style="margin-top: 10px; display: flex; flex-direction: column; gap: 10px;">
<button class="btn primary-btn w-100" id="btn-save-backups" style="padding: 10px; font-weight: 600;" type="button"><i class="fa-solid fa-floppy-disk"></i> <span data-i18n="settings_btn_save_short"></span></button>
<div style="display: flex; gap: 10px; width: 100%;">
<button class="btn secondary-btn w-100" id="btn-download-backup" style="padding: 10px; font-weight: 600;" type="button"><i class="fa-solid fa-download"></i> <span data-i18n="settings_backup_btn_download"></span></button>
<button class="btn secondary-btn w-100" id="btn-trigger-upload-backup" style="padding: 10px; font-weight: 600; border-color: rgba(255, 71, 87, 0.3); color: #ff4757;" type="button"><i class="fa-solid fa-upload"></i> <span data-i18n="settings_backup_btn_restore"></span></button>
</div>
<button class="btn danger-btn w-100" id="btn-clear-backups" style="padding: 10px; font-weight: 600; border: 1px solid rgba(255, 71, 87, 0.3); color: #ff4757; background: rgba(255, 71, 87, 0.1);" type="button"><i class="fa-solid fa-trash-can"></i> <span data-i18n="settings_backup_btn_clear"></span></button>
<input accept=".json" id="backup-file-input" style="display: none;" type="file"/>
</div>
</div>
</div>
</div>
<!-- Modal for Backups Password Setup -->
<div class="modal" id="backup-pwd-setup-modal" style="z-index: 1200;">
<div class="glass-card modal-card" style="max-width: 450px; width: 90%; padding: 25px;">
<div class="modal-header" style="margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
<h3 data-i18n="settings_backup_setup_title" style="margin: 0; font-size: 18px; font-weight: 700; color: var(--text-primary);"></h3>
<button class="btn icon-btn close-modal-btn" id="backup-pwd-setup-close" style="background: transparent; color: var(--text-secondary); border: none; cursor: pointer; font-size: 18px;" type="button"><i class="fa-solid fa-xmark"></i></button>
</div>
<div class="modal-body" style="padding: 0; display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;">
<div class="input-group">
<label data-i18n="settings_backup_new_password" for="setup-backup-password"></label>
<div class="copy-input-group">
<input data-i18n-placeholder="settings_backup_pwd_setup_placeholder" id="setup-backup-password" placeholder="" type="text"/>
<button class="btn secondary-btn" data-i18n-title="ib_title_generate" id="btn-setup-backup-gen" title="" type="button"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
</div>
</div>
<div class="input-group">
<label data-i18n="settings_backup_confirm_password" for="setup-backup-confirm"></label>
<input data-i18n-placeholder="settings_backup_confirm_pwd_placeholder_short" id="setup-backup-confirm" placeholder="" type="password"/>
</div>
</div>
<div style="display: flex; justify-content: flex-end; gap: 10px;">
<button class="btn secondary-btn" data-i18n="config_btn_cancel" id="backup-pwd-setup-cancel" type="button"></button>
<button class="btn primary-btn" data-i18n="config_btn_save" id="backup-pwd-setup-save" type="button"></button>
</div>
</div>
</div>
