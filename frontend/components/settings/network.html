<!-- SECTION 2: NETWORK & SSL -->
<div class="settings-section-panel" id="sec-network">

<div class="glass-card settings-card">
<h3 data-i18n="settings_ssl_title"></h3>
<p class="card-desc" data-i18n="settings_ssl_desc"></p>
<div class="settings-form-content" style="margin-top: auto;">
<div class="input-row" style="display: flex; flex-wrap: wrap; gap: 15px;">
<div class="input-group" style="flex: 1 1 150px;">
<label data-i18n="settings_ssl_domain" for="setting-ssl-domain"></label>
<input id="setting-ssl-domain" placeholder="example.com" type="text"/>
</div>
<div class="input-group" style="flex: 1 1 150px;">
<label data-i18n="settings_ssl_email" for="setting-ssl-email"></label>
<input id="setting-ssl-email" placeholder="admin@example.com" type="email"/>
</div>
</div>
<div style="margin-top: 20px; display: flex; gap: 10px;">
<button class="btn primary-btn w-100" id="btn-save-ssl" style="padding: 10px; font-weight: 600;" type="button"><i class="fa-solid fa-floppy-disk"></i> <span data-i18n="settings_btn_save_short"></span></button>
<button class="btn secondary-btn w-100" id="btn-generate-ssl" style="padding: 10px; font-weight: 600;" type="button"><i class="fa-solid fa-shield-halved"></i> <span data-i18n="settings_ssl_btn_generate"></span></button>
</div>
</div>
</div>

<div class="glass-card settings-card">
<h3 data-i18n="settings_decoy_title"></h3>
<p class="card-desc" data-i18n="settings_decoy_desc"></p>
<div class="settings-form-content" style="margin-top: auto;">
<div class="input-group">
<label data-i18n="settings_decoy_type" for="setting-decoy-type"></label>
<select id="setting-decoy-type">
<option data-i18n="settings_decoy_type_none" value="none"></option>
<option data-i18n="settings_decoy_type_drop" value="drop"></option>
<option data-i18n="settings_decoy_type_static" value="static"></option>
<option data-i18n="settings_decoy_type_proxy" value="proxy"></option>
<option data-i18n="settings_decoy_type_redirect" value="redirect"></option>
</select>
</div>
<div class="input-group" id="setting-decoy-value-group" style="margin-top: 20px;">
<label data-i18n="settings_decoy_val" for="setting-decoy-value" id="setting-decoy-value-label"></label>
<input data-i18n-placeholder="settings_decoy_val_placeholder" id="setting-decoy-value" placeholder="" type="text"/>
<span class="field-desc" data-i18n="settings_decoy_val_desc" id="setting-decoy-value-desc"></span>
</div>
<div style="margin-top: 24px; display: flex; gap: 10px;">
<button class="btn primary-btn w-100" id="btn-save-decoy" style="padding: 10px; font-weight: 600;" type="button"><i class="fa-solid fa-floppy-disk"></i> <span data-i18n="settings_btn_save_short"></span></button>
<button class="btn secondary-btn w-100" id="btn-preview-decoy" style="padding: 10px; font-weight: 600;" type="button"><i class="fa-solid fa-eye"></i> <span data-i18n="settings_btn_preview"></span></button>
</div>
</div>
</div>

<div class="glass-card settings-card">
<h3 data-i18n="settings_mux_title"></h3>
<p class="card-desc" data-i18n="settings_mux_desc"></p>
<div class="settings-form-content" style="margin-top: auto; display: flex; flex-direction: column; gap: 15px;">
<label class="checkbox-container" style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-secondary); font-size: 14px; font-weight: normal; text-transform: none; margin-bottom: 0;">
<input id="setting-mux-enabled" type="checkbox"/>
<span data-i18n="settings_mux_enable"></span>
</label>
<div class="input-group" id="mux-concurrency-group">
<label data-i18n="settings_mux_concurrency" for="setting-mux-concurrency"></label>
<input id="setting-mux-concurrency" max="1024" min="1" type="number" value="8"/>
</div>
<label class="checkbox-container" id="mux-xver-group" style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-secondary); font-size: 14px; font-weight: normal; text-transform: none; margin-bottom: 0;">
<input id="setting-mux-xver" type="checkbox"/>
<span data-i18n="settings_mux_xver"></span>
</label>
<div style="margin-top: 10px;">
<button class="btn primary-btn w-100" id="btn-save-mux" style="padding: 10px; font-weight: 600;" type="button"><i class="fa-solid fa-floppy-disk"></i> <span data-i18n="settings_btn_save_short"></span></button>
</div>
</div>
</div>

<div class="glass-card settings-card" id="card-ipv6">
<h3 data-i18n="settings_ipv6_title"></h3>
<p class="card-desc" data-i18n="settings_ipv6_desc"></p>
<div class="settings-form-content" style="margin-top: auto; display: flex; flex-direction: column; gap: 15px;">
<div style="display: flex; justify-content: space-between; align-items: center; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px 20px;">
<span data-i18n="settings_ipv6_status" style="color: var(--text-secondary); font-size: 14px;"></span>
<span class="badge secondary-badge" id="ipv6-status-badge" style="font-weight: 600; padding: 6px 12px; border-radius: 20px; font-size: 13px;">...</span>
</div>
<div style="display: flex; gap: 10px;">
<button class="btn btn-outline-danger w-100" id="btn-disable-ipv6" style="padding: 10px; font-weight: 600;" type="button"><i class="fa-solid fa-ban"></i> <span data-i18n="settings_ipv6_btn_disable"></span></button>
<button class="btn btn-outline-success w-100" id="btn-enable-ipv6" style="padding: 10px; font-weight: 600;" type="button"><i class="fa-solid fa-circle-check"></i> <span data-i18n="settings_ipv6_btn_enable"></span></button>
</div>
</div>
</div>
</div>
