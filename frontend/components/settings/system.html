<!-- SECTION 4: SYSTEM & WARP -->
<div class="settings-section-panel" id="sec-system">

<div class="glass-card settings-card">
<h3 data-i18n="settings_sys_opt_title"></h3>
<p class="card-desc" data-i18n="settings_sys_opt_desc"></p>
<div style="margin-top: auto;">
<div style="display: flex; justify-content: space-between; align-items: center; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px 20px; margin-bottom: 20px;">
<span data-i18n="settings_sys_opt_status" style="color: var(--text-secondary); font-size: 14px;"></span>
<span class="badge secondary-badge" id="optimization-status-badge" style="font-weight: 600; padding: 6px 12px; border-radius: 20px; font-size: 13px;">...</span>
</div>
<button class="btn primary-btn w-100" id="btn-apply-optimizations" type="button"><i class="fa-solid fa-gauge-high"></i> <span data-i18n="settings_sys_opt_btn"></span></button>
</div>
</div>
<!-- CARD 5.5: Cloudflare WARP -->
<div class="glass-card settings-card" id="settings-card-warp">
<h3 data-i18n="settings_warp_title"></h3>
<p class="card-desc" data-i18n="settings_warp_desc"></p>
<div class="settings-form-content" style="margin-top: auto; display: flex; flex-direction: column; gap: 15px;">
<!-- Status Row 1: Installation -->
<div style="display: flex; justify-content: space-between; align-items: center; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 18px;">
<span data-i18n="settings_warp_installed_label" style="color: var(--text-secondary); font-size: 14px;"></span>
<span class="badge secondary-badge" id="settings-warp-installed-badge" style="font-weight: 600; padding: 5px 11px; border-radius: 20px; font-size: 13px;">...</span>
</div>
<!-- Status Row 2: Connection -->
<div id="settings-warp-status-row" style="display: none; justify-content: space-between; align-items: center; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 18px;">
<span data-i18n="settings_warp_status_label" style="color: var(--text-secondary); font-size: 14px;"></span>
<span class="badge secondary-badge" id="settings-warp-status-badge" style="font-weight: 600; padding: 5px 11px; border-radius: 20px; font-size: 13px;">...</span>
</div>
<!-- Status Row 3: Account -->
<div id="settings-warp-account-row" style="display: none; justify-content: space-between; align-items: center; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 18px;">
<span data-i18n="settings_warp_account_label" style="color: var(--text-secondary); font-size: 14px;"></span>
<span class="badge secondary-badge" id="settings-warp-account-badge" style="font-weight: 600; padding: 5px 11px; border-radius: 20px; font-size: 13px;">...</span>
</div>
<!-- Status Row 4: Quota -->
<div id="settings-warp-quota-row" style="display: none; justify-content: space-between; align-items: center; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 18px;">
<span data-i18n="settings_warp_quota_label" style="color: var(--text-secondary); font-size: 14px;"></span>
<span class="badge secondary-badge" id="settings-warp-quota-badge" style="font-weight: 600; padding: 5px 11px; border-radius: 20px; font-size: 13px;">...</span>
</div>
<!-- Action Button: Install -->
<button class="btn primary-btn w-100" id="btn-warp-install" style="display: none; padding: 12px;" type="button"><i class="fa-solid fa-download"></i> <span data-i18n="settings_warp_btn_install"></span></button>
<!-- WARP Configuration Panel -->
<div id="settings-warp-config-panel" style="display: none; flex-direction: column; gap: 15px;">
<!-- Key Input -->
<div class="input-group">
<label data-i18n="settings_warp_license_label" for="settings-warp-license"></label>
<input data-i18n-placeholder="settings_warp_license_placeholder" id="settings-warp-license" placeholder="" type="text"/>
</div>
<!-- Key Actions -->
<div style="display: flex; gap: 10px;">
<button class="btn primary-btn w-100" id="btn-warp-apply-key" style="padding: 10px;" type="button"><i class="fa-solid fa-key"></i> <span data-i18n="settings_warp_btn_apply_key"></span></button>
<button class="btn secondary-btn w-100" id="btn-warp-register-free" style="display: none; padding: 10px;" type="button"><i class="fa-solid fa-rotate-left"></i> <span data-i18n="settings_warp_btn_register_free"></span></button>
</div>
<!-- Connection Action Toggles -->
<div style="display: flex; gap: 10px;">
<button class="btn btn-outline-success w-100" id="btn-warp-connect" style="padding: 10px;" type="button"><i class="fa-solid fa-play"></i> <span data-i18n="settings_warp_btn_connect"></span></button>
<button class="btn btn-outline-danger w-100" id="btn-warp-disconnect" style="padding: 10px;" type="button"><i class="fa-solid fa-stop"></i> <span data-i18n="settings_warp_btn_disconnect"></span></button>
</div>
<!-- Uninstall Action -->
<button class="btn secondary-btn w-100" id="btn-warp-uninstall" style="margin-top: 10px; padding: 10px; border-color: rgba(255, 71, 87, 0.3); color: #ff4757;" type="button"><i class="fa-solid fa-trash-can"></i> <span data-i18n="settings_warp_btn_uninstall"></span></button>
</div>
</div>
</div>
</div>
