<!-- SECTION 3: TELEGRAM BOT -->
<div class="settings-section-panel" id="sec-telegram">

<div class="glass-card settings-card">
<h3 data-i18n="settings_telegram_config"></h3>
<p class="card-desc" data-i18n="settings_telegram_desc"></p>
<div class="settings-form-content" style="margin-top: auto;">
<div style="display: flex; flex-direction: column; gap: 12px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px 20px; margin-bottom: 20px;">
<label class="checkbox-container" style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-secondary); font-size: 14px; font-weight: normal; text-transform: none; margin-bottom: 0;">
<input id="setting-telegram-bot-enable" type="checkbox"/>
<span data-i18n="settings_telegram_bot_enable"></span>
</label>
<label class="checkbox-container" style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-secondary); font-size: 14px; font-weight: normal; text-transform: none; margin-bottom: 0;">
<input id="setting-telegram-client-events-enable" type="checkbox"/>
<span data-i18n="settings_telegram_client_events_enable"></span>
</label>
</div>
<div class="input-group">
<label data-i18n="settings_telegram_token" for="setting-telegram-token"></label>
<div class="copy-input-group">
<input data-i18n-placeholder="settings_telegram_token_placeholder" id="setting-telegram-token" placeholder="" type="password"/>
<button class="btn" id="btn-toggle-telegram-token" type="button"><i class="fa-regular fa-eye"></i></button>
</div>
</div>
<div class="input-group" style="margin-top: 20px;">
<label data-i18n="settings_telegram_admin_ids" for="setting-telegram-admin-ids"></label>
<input data-i18n-placeholder="settings_telegram_admin_ids_placeholder" id="setting-telegram-admin-ids" placeholder="" type="text"/>
</div>
<div style="margin-top: 24px; display: flex; gap: 10px;">
<button class="btn primary-btn w-100" id="btn-save-telegram" style="padding: 10px; font-weight: 600;" type="button"><i class="fa-solid fa-floppy-disk"></i> <span data-i18n="settings_btn_save_short"></span></button>
<button class="btn secondary-btn w-100" id="btn-restart-telegram-bot" style="padding: 10px; font-weight: 600; border-color: rgba(255, 159, 67, 0.3); color: #ff9f43;" type="button"><i class="fa-solid fa-arrows-rotate"></i> <span data-i18n="settings_telegram_btn_restart"></span></button>
</div>
</div>
</div>
</div>
