
<div class="tab-panel" id="tab-panel-stream" style="display: none;">
<div class="input-group" id="xray-network-security-row">
<label data-i18n="ib_label_network" for="ib-network"></label>
<select id="ib-network">
<option value="tcp">TCP</option>
<option value="ws">WebSocket (WS)</option>
<option value="grpc">gRPC</option>
<option value="h2">HTTP/2 (h2)</option>
<option value="httpupgrade">HTTPUpgrade</option>
<option value="xhttp">XHTTP (SplitHTTP)</option>
<option value="mkcp">mKCP (UDP)</option>
</select>
</div>
<!-- TCP settings subgroup -->
<div class="settings-subgroup" id="tcp-settings-group" style="display: none;">
<h4 data-i18n="ib_title_tcp"></h4>
<div class="input-group">
<label data-i18n="ib_label_tcp_type" for="ib-tcp-type"></label>
<select id="ib-tcp-type">
<option data-i18n="ib_opt_none_obfs" value="none"></option>
<option data-i18n="ib_opt_http_obfs" value="http"></option>
</select>
</div>
<div id="tcp-http-settings" style="display: none; margin-top: 15px;">
<div class="input-group">
<label data-i18n="ib_label_tcp_host" for="ib-tcp-host"></label>
<input id="ib-tcp-host" placeholder="google.com, yandex.ru" type="text"/>
</div>
<div class="input-group" style="margin-top: 10px;">
<label data-i18n="ib_label_tcp_path" for="ib-tcp-path"></label>
<input id="ib-tcp-path" placeholder="/video, /stream" type="text"/>
</div>
</div>
</div>
<!-- WS settings subgroup -->
<div class="settings-subgroup" id="ws-settings-group" style="display: none;">
<h4 data-i18n="ib_title_ws"></h4>
<div class="input-row">
<div class="input-group">
<label data-i18n="ib_label_ws_path" for="ib-ws-path"></label>
<input id="ib-ws-path" placeholder="/" type="text"/>
</div>
<div class="input-group">
<label data-i18n="ib_label_ws_host" for="ib-ws-host"></label>
<input id="ib-ws-host" placeholder="mydomain.com" type="text"/>
</div>
</div>
<div class="input-group" style="margin-top: 15px;">
<label data-i18n="ib_label_ws_ed" for="ib-ws-ed"></label>
<input id="ib-ws-ed" min="0" type="number" value="0"/>
</div>
</div>
<!-- gRPC settings subgroup -->
<div class="settings-subgroup" id="grpc-settings-group" style="display: none;">
<h4 data-i18n="ib_title_grpc"></h4>
<div class="input-group">
<label data-i18n="ib_label_grpc_service" for="ib-grpc-service"></label>
<input id="ib-grpc-service" placeholder="grpc" type="text"/>
</div>
<div class="input-group" style="margin-top: 15px;">
<label class="checkbox-container" style="display: flex; align-items: center; gap: 10px;">
<input id="ib-grpc-multi-mode" type="checkbox"/>
<span data-i18n="ib_label_grpc_multi"></span>
</label>
</div>
</div>
<!-- HTTP/2 settings subgroup -->
<div class="settings-subgroup" id="h2-settings-group" style="display: none;">
<h4 data-i18n="ib_title_h2"></h4>
<div class="input-row">
<div class="input-group">
<label data-i18n="ib_label_h2_path" for="ib-h2-path"></label>
<input id="ib-h2-path" placeholder="/" type="text"/>
</div>
<div class="input-group">
<label data-i18n="ib_label_h2_host" for="ib-h2-host"></label>
<input id="ib-h2-host" placeholder="domain.com" type="text"/>
</div>
</div>
</div>
<!-- HTTPUpgrade settings subgroup -->
<div class="settings-subgroup" id="httpupgrade-settings-group" style="display: none;">
<h4 data-i18n="ib_title_httpupgrade"></h4>
<div class="input-row">
<div class="input-group">
<label data-i18n="ib_label_httpupgrade_path" for="ib-httpupgrade-path"></label>
<input id="ib-httpupgrade-path" placeholder="/" type="text" value="/"/>
</div>
<div class="input-group">
<label data-i18n="ib_label_httpupgrade_host" for="ib-httpupgrade-host"></label>
<input id="ib-httpupgrade-host" placeholder="mydomain.com" type="text"/>
</div>
</div>
</div>
<!-- XHTTP (SplitHTTP) settings subgroup -->
<div class="settings-subgroup" id="xhttp-settings-group" style="display: none;">
<h4 data-i18n="ib_title_xhttp"></h4>
<div class="input-row">
<div class="input-group">
<label data-i18n="ib_label_xhttp_path" for="ib-xhttp-path"></label>
<input id="ib-xhttp-path" placeholder="/" type="text" value="/"/>
</div>
<div class="input-group">
<label data-i18n="ib_label_xhttp_host" for="ib-xhttp-host"></label>
<input id="ib-xhttp-host" placeholder="mydomain.com" type="text"/>
</div>
</div>
<div class="input-group" style="margin-top: 15px;">
<label data-i18n="ib_label_xhttp_mode" for="ib-xhttp-mode"></label>
<select id="ib-xhttp-mode">
<option data-i18n="ib_opt_xhttp_auto" selected="" value="auto"></option>
<option value="packet-up">packet-up</option>
<option value="stream-up">stream-up</option>
<option value="stream-one">stream-one</option>
</select>
</div>
<div class="input-group" style="margin-top: 15px;">
<label data-i18n="ib_label_xhttp_extra" for="ib-xhttp-extra"></label>
<textarea id="ib-xhttp-extra" placeholder='{"noGRPCHeader": false, "noSSEHeader": false}' style="width: 100%; height: 80px; font-family: monospace; font-size: 12px; background: #0b0f19; color: #cbd5e1; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; resize: vertical;"></textarea>
</div>
</div>
<!-- mKCP settings subgroup -->
<div class="settings-subgroup" id="mkcp-settings-group" style="display: none;">
<h4 data-i18n="ib_title_mkcp"></h4>
<div class="input-row">
<div class="input-group">
<label data-i18n="ib_label_mkcp_header" for="ib-mkcp-header"></label>
<select id="ib-mkcp-header">
<option value="none">none</option>
<option value="srtp">srtp</option>
<option value="utp">utp</option>
<option value="wechat-video">wechat-video</option>
<option value="dtls">dtls</option>
<option value="wireguard">wireguard</option>
</select>
</div>
<div class="input-group">
<label data-i18n="ib_label_mkcp_seed" for="ib-mkcp-seed"></label>
<input id="ib-mkcp-seed" placeholder="my_obfs_seed" type="text"/>
</div>
</div>
<div class="input-group" style="margin-top: 15px;">
<label class="checkbox-container" style="display: flex; align-items: center; gap: 10px;">
<input id="ib-mkcp-congestion" type="checkbox"/>
<span data-i18n="ib_label_mkcp_congestion"></span>
</label>
</div>
</div>
<!-- Hysteria 2 settings group -->
<div class="settings-subgroup" id="hysteria-settings-group" style="display: none;">
<h4 data-i18n="ib_title_hysteria"></h4>
<div class="input-group">
<label data-i18n="ib_label_hysteria_mode" for="ib-hysteria-mode"></label>
<select id="ib-hysteria-mode">
<option data-i18n="ib_opt_masq" selected="" value="masq"></option>
<option data-i18n="ib_opt_obfs" value="obfs"></option>
</select>
</div>

<div id="hysteria-obfs-group" style="display: none; margin-top: 15px;">
<div class="input-group">
<label data-i18n="ib_label_hysteria_obfs_pass" for="ib-hysteria-obfs-password"></label>
<div class="copy-input-group">
<input data-i18n-placeholder="ib_placeholder_random_pass" id="ib-hysteria-obfs-password" placeholder="" type="text"/>
<button class="btn secondary-btn" data-i18n-title="ib_title_generate" id="btn-gen-obfs" title="" type="button"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
</div>
</div>
</div>

<div id="hysteria-masq-group" style="margin-top: 15px;">
<div class="input-row">
<div class="input-group">
<label data-i18n="ib_label_hysteria_masq_type" for="ib-hysteria-masq-type"></label>
<select id="ib-hysteria-masq-type">
<option data-i18n="ib_opt_masq_proxy" value="proxy"></option>
<option data-i18n="ib_opt_masq_file" value="file"></option>
<option data-i18n="ib_opt_masq_status" value="status"></option>
</select>
</div>
<div class="input-group">
<label data-i18n="ib_label_hysteria_masq_val" for="ib-hysteria-masq-value"></label>
<input id="ib-hysteria-masq-value" placeholder="https://google.com" type="text"/>
</div>
</div>
</div>
<div class="input-row" style="margin-top: 15px;">
<div class="input-group">
<label data-i18n="ib_label_hysteria_up" for="ib-hysteria-up-mbps"></label>
<input id="ib-hysteria-up-mbps" min="0" type="number" value="100"/>
</div>
<div class="input-group">
<label data-i18n="ib_label_hysteria_down" for="ib-hysteria-down-mbps"></label>
<input id="ib-hysteria-down-mbps" min="0" type="number" value="100"/>
</div>
</div>
<div class="input-group" style="margin-top: 15px;">
<label class="checkbox-container" style="display: flex; align-items: center; gap: 10px;">
<input id="ib-hysteria-ignore-bw" type="checkbox"/>
<span data-i18n="ib_label_hysteria_ignore_bw"></span>
</label>
<small data-i18n="ib_hysteria_ignore_bw_desc" style="color: var(--text-muted); font-size: 11px; margin-top: 4px; display: block;"></small>
</div>
<div class="input-group" style="margin-top: 15px;">
<label data-i18n="ib_label_hysteria_sni" for="ib-hysteria-sni"></label>
<input data-i18n-placeholder="ib_placeholder_hysteria_sni" id="ib-hysteria-sni" placeholder="" type="text"/>
</div>
<div class="input-group" style="margin-top: 15px;">
<label data-i18n="ib_label_hysteria_cert_mode" for="ib-hysteria-cert-mode"></label>
<select id="ib-hysteria-cert-mode">
<option data-i18n="ib_opt_cert_self" value="self"></option>
<option data-i18n="ib_opt_cert_custom" value="custom"></option>
</select>
</div>
<div id="hysteria-custom-cert-fields" style="display: none; margin-top: 15px;">
<div class="input-group">
<label data-i18n="ib_label_hysteria_cert_path" for="ib-hysteria-cert-path"></label>
<input id="ib-hysteria-cert-path" placeholder="/etc/letsencrypt/live/domain/fullchain.pem" type="text"/>
</div>
<div class="input-group" style="margin-top: 10px;">
<label data-i18n="ib_label_hysteria_key_path" for="ib-hysteria-key-path"></label>
<input id="ib-hysteria-key-path" placeholder="/etc/letsencrypt/live/domain/privkey.pem" type="text"/>
</div>
</div>
<div class="input-group" style="margin-top: 15px;">
<label data-i18n="ib_label_hysteria_hop" for="ib-hysteria-hop"></label>
<input data-i18n-placeholder="ib_placeholder_empty_disable" id="ib-hysteria-hop" placeholder="" type="text"/>
</div>
<div class="input-group" style="margin-top: 15px;">
<label class="checkbox-container" style="display: flex; align-items: center; gap: 10px;">
<input id="ib-hysteria-routing-xray" type="checkbox"/>
<span data-i18n="ib_label_hysteria_routing_xray"></span>
</label>
</div>
</div>
</div>
