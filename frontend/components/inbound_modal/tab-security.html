
<div class="tab-panel" id="tab-panel-security" style="display: none;">
<div class="input-group">
<label data-i18n="ib_label_security" for="ib-security"></label>
<select id="ib-security">
<option data-i18n="ib_opt_none_sec" value="none"></option>
<option value="tls">TLS</option>
<option value="reality">REALITY</option>
</select>
</div>
<!-- TLS settings subgroup -->
<div class="settings-subgroup" id="tls-settings-group" style="display: none; margin-top: 15px;">
<h4 data-i18n="ib_title_tls"></h4>
<div class="input-row">
<div class="input-group">
<label data-i18n="ib_label_tls_sni" for="ib-tls-sni"></label>
<input id="ib-tls-sni" placeholder="mydomain.com" type="text"/>
</div>
<div class="input-group">
<label data-i18n="ib_label_tls_alpn" for="ib-tls-alpn"></label>
<input id="ib-tls-alpn" type="text" value="h2,http/1.1"/>
</div>
</div>
<div class="input-row" style="margin-top: 15px;">
<div class="input-group">
<label data-i18n="ib_label_tls_fp" for="ib-tls-fp"></label>
<select id="ib-tls-fp">
<option selected="" value="chrome">chrome</option>
<option value="firefox">firefox</option>
<option value="safari">safari</option>
<option value="edge">edge</option>
<option value="qq">qq</option>
<option value="opera">opera</option>
<option value="360">360</option>
<option value="android">android</option>
<option value="ios">ios</option>
<option value="random">random</option>
<option value="randomized">randomized</option>
</select>
</div>
<div class="input-group">
<label data-i18n="ib_label_tls_min" for="ib-tls-min-ver"></label>
<select id="ib-tls-min-ver">
<option value="1.2">1.2</option>
<option selected="" value="1.3">1.3</option>
</select>
</div>
</div>
<div class="input-row" style="margin-top: 15px;">
<div class="input-group">
<label data-i18n="ib_label_tls_max" for="ib-tls-max-ver"></label>
<select id="ib-tls-max-ver">
<option value="1.2">1.2</option>
<option selected="" value="1.3">1.3</option>
</select>
</div>
</div>
<div class="input-group" style="margin-top: 15px;">
<label class="checkbox-container" style="display: flex; align-items: center; gap: 10px;">
<input id="ib-tls-insecure" type="checkbox"/>
<span data-i18n="ib_label_tls_insecure"></span>
</label>
</div>
</div>
<!-- Reality settings subgroup -->
<div class="settings-subgroup" id="reality-settings-group" style="display: none; margin-top: 15px;">
<h4 data-i18n="ib_title_reality"></h4>
<div class="input-row">
<div class="input-group">
<label data-i18n="ib_label_reality_dest" for="ib-reality-dest"></label>
<input id="ib-reality-dest" placeholder="yahoo.com:443" type="text"/>
</div>
<div class="input-group">
<label data-i18n="ib_label_reality_sni" for="ib-reality-sni"></label>
<input id="ib-reality-sni" placeholder="yahoo.com" type="text"/>
</div>
</div>
<div class="input-group" style="margin-top: 15px;">
<label data-i18n="ib_label_reality_priv" for="ib-reality-priv"></label>
<input data-i18n-placeholder="ib_placeholder_priv_key" id="ib-reality-priv" placeholder="" type="text"/>
</div>
<div class="input-group" style="margin-top: 10px;">
<label data-i18n="ib_label_reality_pbk" for="ib-reality-pbk"></label>
<input data-i18n-placeholder="ib_placeholder_pub_key" id="ib-reality-pbk" placeholder="" type="text"/>
</div>
<div class="input-group" style="margin-top: 15px; display: flex; justify-content: flex-end; gap: 10px;">
<button class="btn secondary-btn" data-i18n="ib_btn_gen_keys" id="gen-x25519-keys-btn" style="padding: 6px 12px; font-size: 13px;" type="button"><i class="fa-solid fa-key"></i></button>
</div>
<div class="input-row" style="margin-top: 15px;">
<div class="input-group">
<label data-i18n="ib_label_reality_shortids" for="ib-reality-shortids"></label>
<input id="ib-reality-shortids" placeholder="8f9c2d1b" type="text"/>
</div>
<div class="input-group" style="display: flex; align-items: flex-end; margin-bottom: 2px;">
<button class="btn secondary-btn" data-i18n="ib_btn_gen_shortid" id="gen-short-ids-btn" style="padding: 10px 12px; font-size: 13px; width: 100%;" type="button"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
</div>
</div>
<div class="input-row" style="margin-top: 15px;">
<div class="input-group">
<label data-i18n="ib_label_reality_fp" for="ib-reality-fp"></label>
<select id="ib-reality-fp">
<option selected="" value="chrome">chrome</option>
<option value="firefox">firefox</option>
<option value="safari">safari</option>
<option value="edge">edge</option>
<option value="qq">qq</option>
<option value="opera">opera</option>
<option value="360">360</option>
<option value="android">android</option>
<option value="ios">ios</option>
<option value="random">random</option>
<option value="randomized">randomized</option>
</select>
</div>
<div class="input-group">
<label data-i18n="ib_label_reality_spx" for="ib-reality-spx"></label>
<input id="ib-reality-spx" placeholder="/" type="text" value=""/>
</div>
</div>
<div class="input-group" style="margin-top: 15px;">
<label data-i18n="ib_label_reality_max_time_diff" for="ib-reality-max-time-diff"></label>
<input data-i18n-placeholder="ib_reality_max_time_diff_placeholder" id="ib-reality-max-time-diff" placeholder="" type="text" value=""/>
<small data-i18n="ib_reality_max_time_diff_hint" style="color: var(--text-muted); font-size: 11px;"></small>
</div>
</div>
</div>
