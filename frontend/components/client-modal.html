<div class="modal" id="client-modal" style="z-index: 1100;">
<div class="glass-card modal-card">
<div class="modal-header">
<h2 data-i18n="client_add_title" id="client-modal-title"></h2>
<button class="btn close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
</div>
<div class="modal-body">
<form id="client-form">
<input id="client-ib-id" type="hidden"/>
<div class="input-group">
<label data-i18n="client_email_label" for="c-email"></label>
<div class="copy-input-group">
<input data-i18n-placeholder="client_email_placeholder" id="c-email" placeholder="" type="text"/>
<button class="btn secondary-btn" data-i18n-title="ib_title_generate" id="c-gen-email-btn" title="" type="button"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
</div>
</div>
<div class="input-group">
<label data-i18n="client_uuid_label" for="c-uuid"></label>
<div class="copy-input-group">
<input data-i18n-placeholder="client_uuid_placeholder" id="c-uuid" placeholder="" type="text"/>
<button class="btn secondary-btn" data-i18n-title="ib_title_generate" id="c-gen-uuid-btn" title="" type="button"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
</div>
</div>
<div class="input-row">
<div class="input-group">
<label data-i18n="client_limit_label" for="c-limit-gb"></label>
<input data-i18n-placeholder="client_placeholder_unlimited" id="c-limit-gb" min="0" placeholder="" type="number" value="0"/>
</div>
<div class="input-group">
<label data-i18n="client_expiry_label" for="c-expiry-days"></label>
<input data-i18n-placeholder="client_placeholder_never" id="c-expiry-days" min="0" placeholder="" type="number" value="0"/>
</div>
</div>
<div class="input-row">
<div class="input-group">
<label data-i18n="client_limit_ip_label" for="c-limit-ip"></label>
<input data-i18n-placeholder="client_placeholder_unlimited" id="c-limit-ip" min="0" placeholder="" type="number" value="0"/>
</div>
<div class="input-group" style="display: flex; flex-direction: column; justify-content: center; margin-top: 15px;">
<label class="checkbox-container" style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-secondary); font-size: 14px; font-weight: normal; text-transform: none;">
<input checked="" id="c-enable" type="checkbox"/>
<span data-i18n="client_enable_label"></span>
</label></div>
<div class="input-group" style="margin-top: 10px;">
<label data-i18n="client_allowed_ips_label" for="c-allowed-ips"></label>
<input data-i18n-placeholder="client_allowed_ips_placeholder" id="c-allowed-ips" placeholder="" type="text"/>
</div>
<div class="input-group" id="client-flow-group" style="display: none;">
<label data-i18n="client_flow_label" for="c-flow"></label>
<select id="c-flow">
<option selected="" value="xtls-rprx-vision">xtls-rprx-vision</option>
<option data-i18n="client_flow_none" value=""></option>
</select>
</div>
<div class="input-group" id="client-vmess-group" style="display: none;">
<div class="input-row">
<div class="input-group">
<label for="c-alter-id">AlterID</label>
<input id="c-alter-id" min="0" type="number" value="0"/>
</div>
<div class="input-group">
<label data-i18n="client_security_label" for="c-security"></label>
<select id="c-security">
<option value="auto">auto</option>
<option value="aes-128-gcm">aes-128-gcm</option>
<option value="chacha20-ietf-poly1305">chacha20-ietf-poly1305</option>
<option value="none">none</option>
</select>
</div>
</div>
</div>
<button class="btn primary-btn w-100" style="margin-top: 10px;" type="submit"><span data-i18n="client_btn_save"></span></button>
</div></form>
</div>
</div>
</div>
