<section class="tab-content" id="tab-xray">
<div class="core-controls glass-card">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
<h3 style="margin: 0; display: flex; align-items: center; gap: 8px;">
<svg fill="currentColor" height="20" style="color: var(--accent-blue); display: inline-block; vertical-align: middle;" viewbox="0 0 24 24" width="20"><path d="M 11,1 C 9.5,7 7,9.5 1,11 L 11,11 Z M 13,1 L 13,11 L 23,11 C 17,9.5 14.5,7 13,1 Z M 13,23 C 14.5,17 17,14.5 23,13 L 13,13 Z M 11,23 L 11,13 L 1,13 C 7,14.5 9.5,17 11,23 Z"></path></svg>
<span data-i18n="xray_title"></span>
</h3>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; color: var(--text-secondary);">
<input id="xray-prerelease-toggle" style="cursor: pointer; accent-color: var(--accent-blue);" type="checkbox"/>
<span data-i18n="xray_include_prerelease"></span>
</label>
</div>
<div class="core-info-row">
<div>
<p class="label" data-i18n="xray_curr_version"></p>
<p class="value" id="core-curr-version">...</p>
</div>
<div>
<p class="label" data-i18n="xray_latest_version"></p>
<div style="display: flex; align-items: center; gap: 8px;">
<p class="value" id="core-latest-version" style="margin: 0;">...</p>
<span class="tag-badge" id="core-prerelease-badge" style="display: none; background: rgba(255, 171, 0, 0.15); color: #ffab00; border: 1px solid rgba(255, 171, 0, 0.3); font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 600;">Pre-release</span>
</div>
<select class="version-select-dropdown" id="core-version-select" style="display: none;"></select>
</div>
<div class="core-actions">
<button class="btn primary-btn" disabled="" id="core-update-btn"><i class="fa-solid fa-download"></i> <span data-i18n="xray_btn_update"></span></button>
<button class="btn secondary-btn" id="core-restart-btn"><i class="fa-solid fa-rotate-right"></i> <span data-i18n="xray_btn_restart"></span></button>
<button class="btn danger-btn" id="core-stop-btn"><i class="fa-solid fa-stop"></i> <span data-i18n="xray_btn_stop"></span></button>
</div>
</div>
</div>

<div class="core-controls glass-card" id="geo-files-card" style="margin-top: 20px;">
<h3 style="margin-bottom: 16px;"><i class="fa-solid fa-earth-americas" style="margin-right: 8px; color: var(--accent-blue);"></i><span data-i18n="geo_title"></span></h3>

<div id="geo-status-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
<div class="geo-file-status glass-card" id="geo-geoip-status" style="padding: 14px 16px; border-radius: 10px; border: 1px solid var(--border-color);">
<div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px;">
<i class="fa-solid fa-database" style="color: var(--accent-purple);"></i>
<strong style="font-size: 14px;">geoip.dat</strong>
<span class="tag-badge tag-badge-proxy" id="geo-geoip-badge" style="font-size: 11px; padding: 2px 8px;">...</span>
</div>
<p id="geo-geoip-meta" style="font-size: 12px; color: var(--text-secondary); margin: 0;">—</p>
</div>
<div class="geo-file-status glass-card" id="geo-geosite-status" style="padding: 14px 16px; border-radius: 10px; border: 1px solid var(--border-color);">
<div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px;">
<i class="fa-solid fa-globe" style="color: var(--accent-teal);"></i>
<strong style="font-size: 14px;">geosite.dat</strong>
<span class="tag-badge tag-badge-proxy" id="geo-geosite-badge" style="font-size: 11px; padding: 2px 8px;">...</span>
</div>
<p id="geo-geosite-meta" style="font-size: 12px; color: var(--text-secondary); margin: 0;">—</p>
</div>
</div>

<div style="margin-bottom: 16px;">
<p data-i18n="geo_url_desc" style="font-size: 13px; color: var(--text-secondary); margin-bottom: 12px;"></p>
<div id="geo-url-inputs" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
<div class="input-group" style="margin-bottom: 0;">
<label data-i18n="geo_geoip_url_label" for="geo-geoip-url" style="font-size: 12px; color: var(--text-secondary);"><i class="fa-solid fa-link" style="margin-right: 4px;"></i></label>
<input class="glass-input" id="geo-geoip-url" placeholder="https://github.com/.../geoip.dat" style="font-size: 13px;" type="url"/>
</div>
<div class="input-group" style="margin-bottom: 0;">
<label data-i18n="geo_geosite_url_label" for="geo-geosite-url" style="font-size: 12px; color: var(--text-secondary);"><i class="fa-solid fa-link" style="margin-right: 4px;"></i></label>
<input class="glass-input" id="geo-geosite-url" placeholder="https://github.com/.../geosite.dat" style="font-size: 13px;" type="url"/>
</div>
</div>
</div>

<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
<button class="btn secondary-btn" id="geo-save-btn" style="min-width: 160px;">
<i class="fa-solid fa-floppy-disk" style="margin-right: 6px;"></i>
<span data-i18n="geo_btn_save"></span>
</button>
<button class="btn primary-btn" id="geo-update-btn" style="min-width: 200px;">
<i class="fa-solid fa-cloud-arrow-down" style="margin-right: 6px;"></i>
<span data-i18n="geo_btn_update"></span>
</button>
<button class="btn icon-btn" data-i18n-title="geo_reset_title" id="geo-reset-btn" style="padding: 8px 12px;" title="">
<i class="fa-solid fa-rotate-left"></i>
</button>
<span id="geo-update-status" style="font-size: 12px; color: var(--text-secondary); display: none;"></span>
</div>
</div>

<div class="terminal-card glass-card" style="margin-top: 20px;">
<div class="terminal-header">
<span style="display: flex; align-items: center; gap: 8px;">
<svg fill="currentColor" height="18" style="color: var(--accent-blue); display: inline-block; vertical-align: middle;" viewbox="0 0 24 24" width="18"><path d="M 11,1 C 9.5,7 7,9.5 1,11 L 11,11 Z M 13,1 L 13,11 L 23,11 C 17,9.5 14.5,7 13,1 Z M 13,23 C 14.5,17 17,14.5 23,13 L 13,13 Z M 11,23 L 11,13 L 1,13 C 7,14.5 9.5,17 11,23 Z"></path></svg>
<span data-i18n="xray_terminal_title"></span>
</span>
<div style="display: flex; gap: 8px;">
<button class="btn icon-btn" data-i18n-title="xray_btn_copy_logs" id="copy-logs-btn" title=""><i class="fa-regular fa-copy"></i></button>
<button class="btn icon-btn" data-i18n-title="xray_btn_clear_logs" id="clear-logs-btn" title=""><i class="fa-regular fa-trash-can"></i></button>
</div>
</div>
<div class="terminal-body" id="logs-terminal">

</div>
</div>

<div class="terminal-card glass-card" style="margin-top: 30px; height: auto; display: flex; flex-direction: column;">
<div class="terminal-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px;">
<span style="display: flex; align-items: center; gap: 8px;">
<svg fill="currentColor" height="18" style="color: var(--accent-blue); display: inline-block; vertical-align: middle;" viewbox="0 0 24 24" width="18"><path d="M 11,1 C 9.5,7 7,9.5 1,11 L 11,11 Z M 13,1 L 13,11 L 23,11 C 17,9.5 14.5,7 13,1 Z M 13,23 C 14.5,17 17,14.5 23,13 L 13,13 Z M 11,23 L 11,13 L 1,13 C 7,14.5 9.5,17 11,23 Z"></path></svg>
<span data-i18n="xray_config_title"></span>
<span class="tag-badge tag-badge-direct" id="xray-config-mode-badge" style="font-size: 11px; margin-left: 6px; padding: 3px 8px; text-transform: uppercase;"></span>
</span>
<div style="display: flex; gap: 8px; align-items: center;">
<button class="btn success-btn" id="xray-config-save-btn" style="padding: 6px 12px; font-size: 13px; display: none;"><i class="fa-solid fa-floppy-disk"></i> <span data-i18n="config_save_btn"></span></button>
<button class="btn danger-btn" id="xray-config-reset-btn" style="padding: 6px 12px; font-size: 13px; display: none;"><i class="fa-solid fa-rotate-left"></i> <span data-i18n="config_reset_btn"></span></button>
<button class="btn secondary-btn active" id="xray-config-tab-parsed" style="padding: 6px 12px; font-size: 13px;"><span data-i18n="xray_config_tab_parsed"></span></button>
<button class="btn secondary-btn" id="xray-config-tab-raw" style="padding: 6px 12px; font-size: 13px;"><span data-i18n="xray_config_tab_raw"></span></button>
</div>
</div>
<!-- Parsed View -->
<div class="config-view-container active" id="xray-config-parsed-container">

</div>
<!-- Raw View -->
<div class="config-view-container" id="xray-config-raw-container" style="display: none; position: relative;">
<button class="btn icon-btn copy-btn" data-i18n-title="copy_btn" data-target="xray-config-raw-pre" id="xray-config-copy-btn" style="position: absolute; right: 15px; top: 15px; background: rgba(0,0,0,0.5); z-index: 10;" title=""><i class="fa-regular fa-copy"></i></button>
<textarea class="terminal-body" id="xray-config-raw-pre" style="height: 350px; margin: 0; font-family: monospace; white-space: pre-wrap; word-break: break-all; overflow-y: auto; user-select: text; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; background: #020617; width: 100%; color: #cbd5e1; outline: none; resize: vertical;"></textarea>
</div>
</div>
</section>
