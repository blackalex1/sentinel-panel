<section class="tab-content" id="tab-hysteria">
<div class="core-controls glass-card">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
<h3 style="margin: 0; display: flex; align-items: center; gap: 8px;">
<svg height="16" style="display: inline-block; vertical-align: middle;" viewbox="0 0 442.19 323.31" width="22"><polygon fill="currentColor" points="72.8 140.45 60.1 285.55 102.51 285.55 111.5 182.86 111.54 182.86 115.21 140.45 72.8 140.45"></polygon><polygon fill="currentColor" points="124.16 37.75 81.76 37.75 76.19 101.36 118.59 101.36 124.16 37.75"></polygon><polygon fill="currentColor" points="318.36 285.56 360.44 285.56 366.01 221.95 323.9 221.95 318.36 285.56"></polygon><polygon fill="currentColor" points="382.09 37.76 340 37.76 329.16 161.66 221.09 161.66 206.95 323.31 292.78 201.84 438.67 201.84 442.19 161.66 371.25 161.66 382.09 37.76"></polygon><polygon fill="#ffbc00" points="149.41 121.47 3.52 121.47 0 161.66 221.09 161.66 235.23 0 149.41 121.47"></polygon></svg>
<span data-i18n="hysteria_title"></span>
</h3>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; color: var(--text-secondary);">
<input id="hysteria-prerelease-toggle" style="cursor: pointer; accent-color: var(--accent-blue);" type="checkbox"/>
<span data-i18n="hysteria_include_prerelease"></span>
</label>
</div>
<div class="core-info-row">
<div>
<p class="label" data-i18n="hysteria_curr_version"></p>
<p class="value" id="hysteria-curr-version">...</p>
</div>
<div>
<p class="label" data-i18n="hysteria_latest_version"></p>
<div style="display: flex; align-items: center; gap: 8px;">
<p class="value" id="hysteria-latest-version" style="margin: 0;">...</p>
<span class="tag-badge" id="hysteria-prerelease-badge" style="display: none; background: rgba(255, 171, 0, 0.15); color: #ffab00; border: 1px solid rgba(255, 171, 0, 0.3); font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 600;">Pre-release</span>
</div>
<select class="version-select-dropdown" id="hysteria-version-select" style="display: none;"></select>
</div>
<div class="core-actions">
<button class="btn primary-btn" disabled="" id="hysteria-update-btn"><i class="fa-solid fa-download"></i> <span data-i18n="hysteria_btn_update"></span></button>
<button class="btn secondary-btn" id="hysteria-restart-btn"><i class="fa-solid fa-rotate-right"></i> <span data-i18n="hysteria_btn_restart"></span></button>
<button class="btn danger-btn" id="hysteria-stop-btn"><i class="fa-solid fa-stop"></i> <span data-i18n="hysteria_btn_stop"></span></button>
</div>
</div>

<div class="core-controls glass-card" id="hysteria-cert-card" style="margin-top: 20px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px;">
    <h3 style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 15px;">
      <i class="fa-solid fa-shield-halved" style="color: var(--accent-blue);"></i>
      <span data-i18n="hysteria_cert_card_title"></span>
      <span class="tag-badge" id="hysteria-cert-status-badge" style="font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 600;" data-i18n="hysteria_cert_status_checking"></span>
    </h3>
    <button class="btn secondary-btn" id="hysteria-reissue-cert-btn" style="padding: 6px 14px; font-size: 12px;">
      <i class="fa-solid fa-arrows-rotate"></i>
      <span data-i18n="hysteria_cert_btn_reissue"></span>
    </button>
  </div>

  <!-- Warning Banner (shown only when certificate is invalid / needs reissue) -->
  <div id="hysteria-cert-alert-box" style="display: none; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; color: #fca5a5;">
    <div style="display: flex; align-items: flex-start; gap: 10px;">
      <i class="fa-solid fa-triangle-exclamation" style="color: #ef4444; font-size: 16px; margin-top: 2px;"></i>
      <div>
        <div style="font-weight: 600; font-size: 13px; color: #f87171; margin-bottom: 4px;" data-i18n="hysteria_cert_alert_title"></div>
        <ul id="hysteria-cert-alert-list" style="margin: 0; padding-left: 18px; font-size: 12px; line-height: 1.5;"></ul>
        <div style="font-size: 11px; color: var(--text-secondary); margin-top: 6px;" data-i18n="hysteria_cert_alert_warning"></div>
      </div>
    </div>
  </div>

  <!-- Certificate Metadata Grid -->
  <div class="core-info-row" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px;">
    <div>
      <p class="label" style="font-size: 11px; color: var(--text-secondary); margin: 0 0 4px 0;" data-i18n="hysteria_cert_label_fp"></p>
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="value" id="hysteria-cert-fingerprint" style="font-family: monospace; font-size: 11px; word-break: break-all; color: var(--accent-blue);">—</span>
        <button class="btn icon-btn" id="hysteria-copy-fp-btn" data-i18n-title="hysteria_cert_copy_fp_title" title="" style="padding: 2px 6px; font-size: 11px;"><i class="fa-regular fa-copy"></i></button>
      </div>
    </div>
    <div>
      <p class="label" style="font-size: 11px; color: var(--text-secondary); margin: 0 0 4px 0;" data-i18n="hysteria_cert_label_cn"></p>
      <p class="value" id="hysteria-cert-cn" style="font-size: 12px; font-family: monospace; margin: 0;">—</p>
    </div>
    <div>
      <p class="label" style="font-size: 11px; color: var(--text-secondary); margin: 0 0 4px 0;" data-i18n="hysteria_cert_label_sans"></p>
      <p class="value" id="hysteria-cert-sans" style="font-size: 11px; font-family: monospace; margin: 0; word-break: break-word;">—</p>
    </div>
    <div>
      <p class="label" style="font-size: 11px; color: var(--text-secondary); margin: 0 0 4px 0;" data-i18n="hysteria_cert_label_expiry"></p>
      <p class="value" id="hysteria-cert-expiry" style="font-size: 12px; margin: 0;">—</p>
    </div>
  </div>
</div>

<div class="terminal-card glass-card">
<div class="terminal-header">
<span style="display: flex; align-items: center; gap: 8px;">
<svg height="15" style="display: inline-block; vertical-align: middle;" viewbox="0 0 442.19 323.31" width="20"><polygon fill="currentColor" points="72.8 140.45 60.1 285.55 102.51 285.55 111.5 182.86 111.54 182.86 115.21 140.45 72.8 140.45"></polygon><polygon fill="currentColor" points="124.16 37.75 81.76 37.75 76.19 101.36 118.59 101.36 124.16 37.75"></polygon><polygon fill="currentColor" points="318.36 285.56 360.44 285.56 366.01 221.95 323.9 221.95 318.36 285.56"></polygon><polygon fill="currentColor" points="382.09 37.76 340 37.76 329.16 161.66 221.09 161.66 206.95 323.31 292.78 201.84 438.67 201.84 442.19 161.66 371.25 161.66 382.09 37.76"></polygon><polygon fill="#ffbc00" points="149.41 121.47 3.52 121.47 0 161.66 221.09 161.66 235.23 0 149.41 121.47"></polygon></svg>
<span data-i18n="hysteria_terminal_title"></span>
</span>
<div style="display: flex; gap: 8px;">
<button class="btn icon-btn" data-i18n-title="hysteria_btn_copy_logs" id="hysteria-copy-logs-btn" title=""><i class="fa-regular fa-copy"></i></button>
<button class="btn icon-btn" data-i18n-title="hysteria_btn_clear_logs" id="hysteria-clear-logs-btn" title=""><i class="fa-regular fa-trash-can"></i></button>
</div>
</div>
<div class="terminal-body" id="hysteria-logs-terminal">

</div>
</div>

<div class="terminal-card glass-card" style="margin-top: 30px; height: auto; display: flex; flex-direction: column;">
<div class="terminal-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px; flex-wrap: wrap; gap: 15px;">
<span style="display: flex; align-items: center; gap: 8px;">
<svg height="15" style="display: inline-block; vertical-align: middle;" viewbox="0 0 442.19 323.31" width="20"><polygon fill="currentColor" points="72.8 140.45 60.1 285.55 102.51 285.55 111.5 182.86 111.54 182.86 115.21 140.45 72.8 140.45"></polygon><polygon fill="currentColor" points="124.16 37.75 81.76 37.75 76.19 101.36 118.59 101.36 124.16 37.75"></polygon><polygon fill="currentColor" points="318.36 285.56 360.44 285.56 366.01 221.95 323.9 221.95 318.36 285.56"></polygon><polygon fill="currentColor" points="382.09 37.76 340 37.76 329.16 161.66 221.09 161.66 206.95 323.31 292.78 201.84 438.67 201.84 442.19 161.66 371.25 161.66 382.09 37.76"></polygon><polygon fill="#ffbc00" points="149.41 121.47 3.52 121.47 0 161.66 221.09 161.66 235.23 0 149.41 121.47"></polygon></svg>
<span data-i18n="hysteria_config_title"></span>
<span class="tag-badge tag-badge-direct" id="hysteria-config-mode-badge" style="font-size: 11px; margin-left: 6px; padding: 3px 8px; text-transform: uppercase;"></span>
</span>
<div style="display: flex; align-items: center; gap: 15px; margin-left: auto;">

<div id="hysteria-inbound-select-wrapper" style="display: none; align-items: center; gap: 8px;">
<label data-i18n="hysteria_config_select_label" for="hysteria-config-inbound-select" style="font-size: 13px; color: var(--text-secondary);"></label>
<select class="glass-select" id="hysteria-config-inbound-select" style="background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; outline: none; transition: var(--transition-fast); color: var(--text-primary);">

</select>
</div>
<div style="display: flex; gap: 8px; align-items: center;">
<button class="btn success-btn" id="hysteria-config-save-btn" style="padding: 6px 12px; font-size: 13px; display: none;"><i class="fa-solid fa-floppy-disk"></i> <span data-i18n="config_save_btn"></span></button>
<button class="btn danger-btn" id="hysteria-config-reset-btn" style="padding: 6px 12px; font-size: 13px; display: none;"><i class="fa-solid fa-rotate-left"></i> <span data-i18n="config_reset_btn"></span></button>
<button class="btn secondary-btn active" id="hysteria-config-tab-parsed" style="padding: 6px 12px; font-size: 13px;"><span data-i18n="hysteria_config_tab_parsed"></span></button>
<button class="btn secondary-btn" id="hysteria-config-tab-raw" style="padding: 6px 12px; font-size: 13px;"><span data-i18n="hysteria_config_tab_raw"></span></button>
</div>
</div>
</div>
<!-- Parsed View -->
<div class="config-view-container active" id="hysteria-config-parsed-container">

</div>
<!-- Raw View -->
<div class="config-view-container" id="hysteria-config-raw-container" style="display: none; position: relative;">
<button class="btn icon-btn copy-btn" data-i18n-title="copy_btn" data-target="hysteria-config-raw-pre" id="hysteria-config-copy-btn" style="position: absolute; right: 15px; top: 15px; background: rgba(0,0,0,0.5); z-index: 10;" title=""><i class="fa-regular fa-copy"></i></button>
<textarea class="terminal-body" id="hysteria-config-raw-pre" style="height: 350px; margin: 0; font-family: monospace; white-space: pre-wrap; word-break: break-all; overflow-y: auto; user-select: text; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; background: #020617; width: 100%; color: #cbd5e1; outline: none; resize: vertical;"></textarea>
</div>
</div>
</section>
